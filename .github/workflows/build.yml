name: Build Website

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build Website
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: false

      - name: Install Project Tools
        run: mise install

      - name: Install Dependencies
        run: mise run setup

      - name: Test Reference Generator
        run: mise run test:reference

      - name: Build Website
        run: mise run build

      - name: Deploy
        if: github.ref == 'refs/heads/main'
        uses: silitics/actions/deploy-site@87cc4a5ff8e6df4e7ee89b927f6d7726ca0db1fd # main (2026-10-11)
        with:
          domain: rugix.org
          source-dir: dist
          s3-access-key: ${{ vars.SILITICS_SITES_ACCESS_KEY }}
          s3-secret-key: ${{ secrets.SILITICS_SITES_SECRET_KEY }}

[tools]
node = "24"
pnpm = "9"

[tasks.setup]
description = "Install locked site dependencies."
run = "pnpm install --frozen-lockfile"

[tasks.dev]
description = "Run the development server."
run = "bash scripts/serve.sh dev"

[tasks.preview]
description = "Preview the generated site, including search."
run = "bash scripts/serve.sh preview"

[tasks."test:reference"]
description = "Test the Bakery reference generator."
run = "node --test scripts/generate-reference.test.mjs"

[tasks.build]
description = "Build the static site into dist/."
run = "pnpm build"

[tasks.check]
description = "Run astro check (type / content collection validation)."
run = "pnpm check"

[tasks."check:links"]
description = "Build the static site and check generated internal links."
run = "node scripts/check-links.mjs"

[tasks.format]
description = "Format the repository."
run = "pnpm fmt"
